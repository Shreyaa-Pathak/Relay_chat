name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay_test
      TEST_REDIS_URL: redis://localhost:6379
      E2E_DATABASE_URL: postgres://relay:relay@localhost:5432/relay_e2e
      E2E_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create e2e database
        run: PGPASSWORD=relay psql -h localhost -U relay -d relay_test -c "CREATE DATABASE relay_e2e"
      - run: sudo apt-get update && sudo apt-get install -y redis-tools postgresql-client
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (Postgres + Redis, two server instances)
        run: pnpm test:integration
      - name: Install Playwright Chromium
        run: pnpm --filter @relay/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
